apiVersion: backstage.io/v1alpha1
kind: Component
spec:
  type: library
  lifecycle: production
  owner: team-developer-experience
  system: prima.it
metadata:
  name: bridge_ex 
  description: A library to build bridges to other services (currently only GraphQL ones are supported)
  tags:
    - elixir
  annotations:
    prima.it/library-adoption: |
      {
        "entityFilter": {
          "kind": "Component",
          "type": ["service", "custom", "web", "library"]
        },
        "scanFiles": ["mix.exs"],
        "dependencies": ["primapy-tracing"],
        "parser": "mix"
      }
  links:
    - url: https://hex.pm/packages/bridge_ex
      icon: link
      title: Hex.pm
    - url: https://hexdocs.pm/bridge_ex
      icon: link
      title: official documentation
